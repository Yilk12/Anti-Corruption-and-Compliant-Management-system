version: "3.9"
services:
  db:
    image: postgres:15-alpine
    container_name: ecschelpdesk-db
    environment:
      # Use environment variables for production
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_this_password_in_production}
      - POSTGRES_DB=${POSTGRES_DB:-ecsc_helpdesk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  # Optional: pgAdmin for database management (comment out in production)
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: ecschelpdesk-pgadmin
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
  #     - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-change_this_password}
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db
  #   networks:
  #     - app-network
  #   restart: unless-stopped

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
